seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
#
# skrl 2.x separates the per-agent OBSERVATIONS from the global (privileged) STATES, so CTDE is
# expressed by what each model reads rather than by agent flags:
#   - the decentralized policy reads OBSERVATIONS (135 per agent)
#   - the centralized critic reads STATES (84, shared by all agents)
# Under skrl 1.x "STATES" meant the per-agent observation, so the policy input below was STATES.
models:
  separate: True  # separate actor and critic models
  shared_across_agents: True  # one policy/value instance shared by every agent (parameter sharing)
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 512, 256, 128]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [1024, 512, 256, 128]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# MAPPO agent configuration (field names are from MAPPO_CFG)
# https://skrl.readthedocs.io/en/latest/api/multi_agents/mappo.html
agent:
  class: MAPPO
  rollouts: 128 # higher better
  learning_epochs: 5 # reduce
  mini_batches: 4
  discount_factor: 0.99
  gae_lambda: 0.95
  # (policy, value) learning rates; requires separate_optimizers
  learning_rate: [5.0e-05, 1.0e-04]
  separate_optimizers: True
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  # learning_rate_scheduler: [CosineAnnealingLR, CosineAnnealingLR]
  # learning_rate_scheduler_kwargs:
  #   - T_max: 40000 # timesteps divided by rollouts times learning_epochs
  #     eta_min: 1.0e-6
  #   - T_max: 40000
  #     eta_min: 1.0e-6
  observation_preprocessor: RunningStandardScaler   # policy input (per-agent observations)
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler         # critic input (global state)
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.1
  value_clip: 0.1
  entropy_loss_scale: 0.001
  value_loss_scale: 1.0
  kl_threshold: 0.0
  advantage_filter_ratio: 0.0  # 0.5 reproduces the old hard-coded filtering
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: True
  # logging and checkpoint
  experiment:
    directory: "mappo_flycrane_hover"
    experiment_name: "delete_me"
    write_interval: 100
    checkpoint_interval: 5000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 1500000
  environment_info: log
